name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build project
        run: npm run build
    env:
      OPEN_METEO_API_URL: ${{ vars.OPEN_METEO_API_URL }}
      OPEN_METEO_GEOCODING_URL: ${{ vars.OPEN_METEO_GEOCODING_URL }}
      OPEN_METEO_TIMEOUT: ${{ vars.OPEN_METEO_TIMEOUT }}
